name: Apply PSR-4 renames
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/psr4-autoload-compliance
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply renames
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p app/Http/Controllers/Academic \
                   app/Http/Controllers/Settings/Communication \
                   app/Http/Controllers/Settings/System \
                   app/Http/Resources/Academic \
                   app/Http/Requests/BulkActions/Traits \
                   app/Services/Academic \
                   app/Policies

          move_or_cleanup() {
            local src="$1" dest="$2"
            if [ -f "$src" ] && [ ! -e "$dest" ]; then
              git mv "$src" "$dest"
            elif [ -f "$src" ] && [ -e "$dest" ]; then
              # Destination already has the correct file from a partial push; drop the old path
              git rm -f "$src"
            fi
          }

          move_or_cleanup app/Http/Controllers/SchoolSectionController.php app/Http/Controllers/Settings/SchoolSectionController.php
          move_or_cleanup app/Http/Controllers/Exam/AssessmentTemplateController.php app/Http/Controllers/Academic/AssessmentTemplateController.php
          move_or_cleanup app/Http/Controllers/Exam/ExamController.php app/Http/Controllers/Academic/ExamController.php
          move_or_cleanup app/Http/Controllers/Exam/ExamResultsController.php app/Http/Controllers/Academic/ExamResultsController.php
          move_or_cleanup app/Http/Controllers/Exam/ReportCardController.php app/Http/Controllers/Academic/ReportCardController.php
          move_or_cleanup app/Http/Controllers/Exam/ScoreEntryController.php app/Http/Controllers/Academic/ScoreEntryController.php
          move_or_cleanup app/Http/Controllers/Settings/Academic/GradeController.php app/Http/Controllers/GradeController.php
          move_or_cleanup app/Http/Controllers/Settings/Communication/EmailController.php app/Http/Controllers/Settings/Communication/EmailSettingsController.php
          move_or_cleanup app/Http/Controllers/Settings/System/GDPRController.php app/Http/Controllers/Settings/System/GdprSettingsController.php
          move_or_cleanup app/Http/Controllers/Academic/ClassLevelController.php app/Http/Controllers/ClassLevelController.php

          move_or_cleanup app/Http/Resources/Academic/ClassLevelResource.php app/Http/Resources/ClassLevelResource.php
          move_or_cleanup app/Http/Resources/Academic/ClassSectionMinimalResource.php app/Http/Resources/ClassSectionMinimalResource.php
          move_or_cleanup app/Http/Resources/Academic/ClassSectionResource.php app/Http/Resources/ClassSectionResource.php
          move_or_cleanup app/Http/Resources/Academic/SubjectResource.php app/Http/Resources/SubjectResource.php
          move_or_cleanup app/Http/Resources/Exam/ComputedResultResource.php app/Http/Resources/Academic/ComputedResultResource.php

          move_or_cleanup app/Policies/Academic/ClassLevelPolicy.php app/Policies/ClassLevelPolicy.php
          move_or_cleanup app/Policies/Academic/ClassPeriodPolicy.php app/Policies/ClassPeriodPolicy.php
          move_or_cleanup app/Policies/Academic/ClassSectionPolicy.php app/Policies/ClassSectionPolicy.php
          move_or_cleanup app/Policies/UserManagement/ProfilePolicy.php app/Policies/ProfilePolicy.php

          move_or_cleanup app/Services/GradeService.php app/Services/Academic/GradeService.php
          move_or_cleanup app/Models/Academic/TimeTable.php app/Models/Academic/Timetable.php
          move_or_cleanup app/Traits/BulkActions/HandlesBulkActions.php app/Http/Requests/BulkActions/Traits/HandlesBulkActions.php

          if grep -q 'use App\\Http\\Controllers\\SchoolSectionController;' routes/web.php 2>/dev/null; then
            sed -i 's/use App\\Http\\Controllers\\SchoolSectionController;/use App\\Http\\Controllers\\Settings\\SchoolSectionController;/' routes/web.php
          fi
          for f in app/Http/Controllers/TimeTableController.php \
                   app/Http/Controllers/TimeTableDetailController.php \
                   app/Policies/TimeTablePolicy.php \
                   app/Jobs/GenerateTimeTableEntries.php \
                   app/Notifications/TimeTableGeneratedNotification.php \
                   database/factories/Academic/TimeTableFactory.php; do
            if [ -f "$f" ]; then
              sed -i 's/App\\Models\\Academic\\TimeTable/App\\Models\\Academic\\Timetable/g' "$f"
            fi
          done

          rmdir app/Http/Controllers/Exam 2>/dev/null || true
          rmdir app/Http/Resources/Exam 2>/dev/null || true
          rmdir app/Traits/BulkActions 2>/dev/null || true

          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(psr4): complete remaining path/namespace alignment"
            git push origin HEAD:fix/psr4-autoload-compliance
          fi
